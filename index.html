<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;450;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#ffffff; --fg:#13131a; --muted:#9b9aa3; --card:#f0f0f2;
    --line:rgba(0,0,0,.08); --hover:rgba(0,0,0,.04);
    --ink:#13131a; --ink-fg:#fff; --search:#f3f3f5; --radius:10px; --gap:3px;
    --panel:#fff; --backdrop:rgba(15,15,20,.55);
  }
  html.dark{
    --bg:#0c0c0e; --fg:#f1f1f4; --muted:#76757e; --card:#1a1a1f;
    --line:rgba(255,255,255,.1); --hover:rgba(255,255,255,.06);
    --ink:#f1f1f4; --ink-fg:#0c0c0e; --search:#1a1a1f; --panel:#141417; --backdrop:rgba(0,0,0,.66);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg); color:var(--fg);
    font:15px/1.45 "Hanken Grotesk",-apple-system,system-ui,sans-serif; font-weight:450;
    -webkit-font-smoothing:antialiased}
  ::selection{background:#c9c9d6}

  header{position:sticky; top:0; z-index:30; display:flex; align-items:center; justify-content:center;
    height:68px; padding:0 24px; background:color-mix(in srgb,var(--bg) 80%,transparent);
    backdrop-filter:blur(16px) saturate(150%)}
  .hctrl{position:absolute; right:20px; top:50%; transform:translateY(-50%); display:flex; gap:6px; align-items:center}
  .hbtn{height:38px; padding:0 14px; border:1px solid var(--line); border-radius:999px; background:transparent;
    color:var(--fg); font:inherit; font-weight:500; font-size:13.5px; cursor:pointer; display:flex; align-items:center; gap:6px; transition:.12s}
  .hbtn:hover{background:var(--hover)}
  .hbtn.icon{width:38px; padding:0; justify-content:center}
  .hbtn[hidden]{display:none}   /* display:flex 会盖掉 [hidden] 默认的 display:none */
  .brand{position:absolute; left:20px; top:50%; transform:translateY(-50%); width:34px; height:34px; display:flex}
  .brand svg{width:100%; height:100%; filter:drop-shadow(0 2px 6px rgba(47,79,214,.35))}
  @media(max-width:720px){.hctrl{right:12px} .brand{display:none}}
  .search{width:100%; max-width:540px; position:relative}
  .search input{width:100%; height:44px; padding:0 16px 0 44px; border:1px solid transparent;
    border-radius:999px; background:var(--search); color:var(--fg); font:inherit; font-weight:450; outline:none;
    transition:background .15s,border-color .15s,box-shadow .15s}
  .search input::placeholder{color:var(--muted)}
  .search input:focus{background:var(--panel); border-color:var(--line); box-shadow:0 1px 10px rgba(0,0,0,.05)}
  .search svg{position:absolute; left:16px; top:13px; color:var(--muted)}

  nav.cats{position:sticky; top:68px; z-index:25; display:flex; gap:3px; overflow-x:auto;
    scrollbar-width:none; padding:4px 18px 14px; background:var(--bg)}
  nav.cats::-webkit-scrollbar{display:none}
  .chip{flex:none; padding:7px 14px; border-radius:999px; border:0; background:transparent;
    color:var(--muted); font:inherit; font-weight:500; font-size:13.5px; cursor:pointer; white-space:nowrap;
    transition:color .14s,background .14s}
  .chip:hover{color:var(--fg); background:var(--hover)}
  .chip.on{background:var(--ink); color:var(--ink-fg)}
  .chip.on:hover{background:var(--ink)}

  main{padding:4px 10px 110px}
  .grid{column-gap:var(--gap); column-count:5}
  @media(max-width:1500px){.grid{column-count:4}}
  @media(max-width:1080px){.grid{column-count:3}}
  @media(max-width:720px){.grid{column-count:2} main{padding:6px 12px 90px} header{padding:0 14px} nav.cats{padding:4px 12px 12px}}
  @media(max-width:440px){.grid{column-count:1}}

  .card{break-inside:avoid; margin-bottom:var(--gap); position:relative; border-radius:0;
    overflow:hidden; cursor:zoom-in; background:var(--card); animation:rise .45s both}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .card img{display:block; width:100%; height:auto; opacity:0; transition:opacity .5s ease, transform .5s ease}
  .card img.on{opacity:1}
  .card:hover img{transform:scale(1.04)}
  .card .ov{position:absolute; inset:0; padding:11px; display:flex; align-items:flex-end;
    background:linear-gradient(to top,rgba(0,0,0,.5),transparent 46%); opacity:0; transition:opacity .18s}
  .card:hover .ov{opacity:1}
  .card .ttl{color:#fff; font-weight:500; font-size:13px; line-height:1.3; overflow-wrap:anywhere}
  .card .mt{color:rgba(255,255,255,.7); font-size:11px; margin-top:1px}
  .card .del{position:absolute; top:9px; right:9px; width:28px; height:28px; border-radius:50%;
    border:0; background:rgba(0,0,0,.45); color:#fff; cursor:pointer; display:grid; place-items:center;
    opacity:0; transform:scale(.85); transition:.15s; backdrop-filter:blur(4px)}
  .card:hover .del{opacity:1; transform:none}
  .card .del:hover{background:#e0392b}

  .empty{padding:130px 24px; text-align:center; color:var(--muted)}
  .empty .big{font-size:24px; font-weight:600; color:var(--fg); margin-bottom:8px; letter-spacing:-.01em}

  #fab{position:fixed; right:22px; bottom:22px; z-index:50; height:48px; padding:0 20px; border:0;
    border-radius:999px; background:var(--ink); color:var(--ink-fg); font-family:inherit; font-size:14.5px;
    font-weight:600; cursor:pointer; display:flex; align-items:center; gap:7px; box-shadow:0 6px 24px rgba(0,0,0,.2)}
  #fab:hover{transform:translateY(-1px)}
  #fab{transition:right .24s ease}

  /* ── modal ── */
  #modal[hidden]{display:none}
  #modal{position:fixed; inset:0; z-index:60; display:flex; align-items:center; justify-content:center; padding:20px}
  .mback{position:absolute; inset:0; background:var(--backdrop); backdrop-filter:blur(4px)}
  .mpanel{position:relative; background:var(--panel); color:var(--fg); border-radius:18px; max-width:1080px;
    width:100%; max-height:92vh; overflow:hidden; box-shadow:0 30px 80px rgba(0,0,0,.5)}
  .mpanel.narrow{max-width:400px}

  /* detail */
  .detail{display:grid; grid-template-columns:1.6fr 1fr; max-height:92vh}
  .detail .imgwrap{background:var(--card); display:flex; align-items:center; justify-content:center; min-height:300px}
  .detail .imgwrap img{width:100%; height:100%; max-height:92vh; object-fit:contain}
  .detail .side{display:flex; flex-direction:column; padding:24px; overflow:auto}
  .detail .dt{font-size:22px; font-weight:600; letter-spacing:-.01em; line-height:1.25;
    overflow-wrap:anywhere; word-break:break-word; padding-right:40px}
  .detail .dc{color:var(--muted); font-size:13.5px; margin-top:6px}
  .detail .tags{margin-top:16px}
  .detail .actions{display:flex; gap:8px; flex-wrap:wrap; margin-top:auto; padding-top:22px}
  @media(max-width:720px){.detail{grid-template-columns:1fr; max-height:none} .detail .imgwrap img{max-height:50vh}}

  .tag{display:inline-block; padding:4px 11px; border-radius:999px; background:var(--card); font-size:12px; margin:0 6px 6px 0}
  .mclose{position:absolute; top:14px; right:14px; z-index:2; width:34px; height:34px; border-radius:50%;
    border:0; background:color-mix(in srgb,var(--panel) 70%,transparent); color:var(--fg); cursor:pointer;
    display:grid; place-items:center; backdrop-filter:blur(6px)}
  .mclose:hover{background:var(--hover)}

  /* upload / login */
  .uphead{padding:18px 22px; font-size:17px; font-weight:600; border-bottom:1px solid var(--line)}
  .upbody{padding:8px 22px; max-height:60vh; overflow:auto}
  .mrow{display:flex; gap:14px; align-items:flex-start; padding:14px 0; border-bottom:1px solid var(--line)}
  .mrow:last-child{border-bottom:0}
  .mrow img{width:84px; height:84px; object-fit:cover; border-radius:10px; flex:none}
  .mfields{flex:1; display:flex; flex-direction:column; gap:8px}
  .foot{display:flex; justify-content:flex-end; gap:8px; padding:16px 22px; border-top:1px solid var(--line)}
  /* 独立登录整页（Uiverse by andrew-demchenk0，去注册版） */
  #loginpage[hidden]{display:none}
  #loginpage{position:fixed; inset:0; z-index:100; display:flex; align-items:center; justify-content:center;
    padding:24px; background:var(--bg)}
  .loginwrap{--input-focus:#2d8cf0; --font-color:#323232; --font-color-sub:#666; --bg-color:#fff; --main-color:#323232}
  .logincard{display:flex; flex-direction:column; align-items:center; gap:20px; width:320px; padding:22px 20px 26px;
    background:lightgrey; border-radius:5px; border:2px solid var(--main-color); box-shadow:4px 4px var(--main-color)}
  .logincard .title{margin:6px 0 0; font-size:25px; font-weight:900; text-align:center; color:var(--main-color)}
  .logincard form{display:flex; flex-direction:column; align-items:center; gap:18px; width:100%}
  .flip-card__input{width:250px; height:40px; border-radius:5px; border:2px solid var(--main-color);
    background:var(--bg-color); box-shadow:4px 4px var(--main-color); font-size:15px; font-weight:600;
    color:var(--font-color); padding:5px 10px; outline:none; font-family:inherit}
  .flip-card__input::placeholder{color:var(--font-color-sub); opacity:.8}
  .flip-card__input:focus{border:2px solid var(--input-focus)}
  .flip-card__btn{margin:6px 0 0; width:130px; height:42px; border-radius:5px; border:2px solid var(--main-color);
    background:var(--bg-color); box-shadow:4px 4px var(--main-color); font-size:17px; font-weight:600;
    color:var(--font-color); cursor:pointer; font-family:inherit; transition:.1s}
  .flip-card__btn:active{box-shadow:0 0 var(--main-color); transform:translate(3px,3px)}
  .lerr{color:#c0241a; font-size:13px; font-weight:600; min-height:16px; text-align:center}
  .lcancel{background:none; border:0; color:var(--main-color); font:inherit; font-size:13px; cursor:pointer; opacity:.65}
  .lcancel:hover{opacity:1}

  input.f{width:100%; font-family:inherit; font-size:14px; font-weight:450; padding:10px 13px;
    border:1px solid var(--line); border-radius:10px; background:var(--bg); color:inherit; outline:none}
  input.f:focus{border-color:var(--muted)}
  .btn{font-family:inherit; font-size:14px; font-weight:500; padding:9px 18px; border-radius:999px; cursor:pointer;
    border:1px solid var(--line); background:transparent; color:inherit; transition:.12s}
  .btn:hover{background:var(--hover)}
  .btn.pri{background:var(--ink); color:var(--ink-fg); border-color:transparent}
  .btn.pri:hover{opacity:.9}
  .btn.danger{color:#e0392b; border-color:rgba(224,57,43,.3)}
  .btn.danger:hover{background:rgba(224,57,43,.08)}
  .btn:disabled{opacity:.45; cursor:not-allowed}
  .btn:disabled:hover{background:transparent}
  .btn.pri:disabled:hover{opacity:.45}

  /* ── AI 工作台：与主内容同层「挤压」而非遮盖 ──────────────────
     主体三块（header / nav / main）在面板打开时右侧让出空间，瀑布流会
     自然重排列数；面板本身 fixed 贴右，没有遮罩层。
     刻意不照搬鉴定系统的圆角卡片风：那边是数据密集的后台表单，这里跟
     瀑布流的方角、窄边框对齐。 */
  :root{--aiw:420px}
  header,nav.cats,main{transition:padding-right .24s ease}
  body.ai-on header,body.ai-on nav.cats,body.ai-on main{padding-right:calc(var(--aiw) + 10px)}
  /* 上传浮钮 z-index 比侧栏高，不让位就会盖住发送键 */
  body.ai-on #fab{right:calc(var(--aiw) + 22px)}
  /* header 右上角这组是 absolute 定位的，不吃 padding-right，必须单独让位 */
  .hctrl{transition:right .24s ease}
  body.ai-on .hctrl{right:calc(var(--aiw) + 20px)}
  #aiside[hidden]{display:none}
  #aiside{position:fixed; top:0; right:0; z-index:40; height:100dvh; width:var(--aiw);
    display:flex; flex-direction:column; background:var(--panel);
    border-left:1px solid var(--line); animation:slide .24s ease}
  @keyframes slide{from{transform:translateX(100%)}to{transform:none}}
  /* 左边缘拖拽条：拖它改 --aiw，主内容的 padding 跟着变，所以拖动就是实时挤压 */
  .aigrip{position:absolute; left:-3px; top:0; width:7px; height:100%; cursor:col-resize; z-index:2}
  .aigrip::after{content:''; position:absolute; left:2px; top:0; width:3px; height:100%;
    background:transparent; transition:background .14s}
  .aigrip:hover::after,body.aidrag .aigrip::after{background:var(--muted)}
  body.aidrag{cursor:col-resize; user-select:none}
  /* 拖动时关掉过渡，否则跟手会有延迟 */
  body.aidrag header,body.aidrag nav.cats,body.aidrag main,body.aidrag #fab,body.aidrag .hctrl{transition:none}
  body.aidrag #aiside{animation:none}
  .tplbadge{display:inline-block; padding:3px 9px; margin-bottom:8px; border:1px solid var(--line);
    border-radius:999px; font-size:11px; color:var(--muted)}
  .aihead{display:flex; align-items:center; gap:9px; padding:15px 16px; border-bottom:1px solid var(--line)}
  .aihead .t{font-size:14.5px; font-weight:600; letter-spacing:-.01em}
  .aihead .who{font-size:11px; color:var(--muted); padding:2px 8px; border:1px solid var(--line); border-radius:999px}
  .aihead .ico{width:29px; height:29px; border:0; border-radius:8px; background:transparent;
    color:var(--muted); cursor:pointer; display:grid; place-items:center}
  .aihead .ico:hover{background:var(--hover); color:var(--fg)}
  .aihead .ico.r{margin-left:auto}
  .aitabs{display:flex; padding:10px 16px 0; gap:2px}
  .aitab{flex:1; padding:8px 0; border:0; border-bottom:2px solid transparent; background:transparent;
    color:var(--muted); font:inherit; font-weight:500; font-size:13px; cursor:pointer}
  .aitab.on{color:var(--fg); border-bottom-color:var(--ink)}
  .aibody{flex:1; overflow:auto; padding:18px 18px 22px}

  /* 对话流 */
  .msgs{display:flex; flex-direction:column; gap:20px}
  .msg.u{align-self:flex-end; max-width:88%; padding:10px 14px; border-radius:16px 16px 4px 16px;
    background:var(--ink); color:var(--ink-fg); font-size:13.5px; line-height:1.5; overflow-wrap:anywhere}
  .msg.a{align-self:flex-start; width:100%}
  .msg .rp{font-size:11.5px; color:var(--muted); line-height:1.6; margin-bottom:10px; overflow-wrap:anywhere}
  .shot{border:1px solid var(--line); background:var(--card); overflow:hidden}
  .shot img{display:block; width:100%; height:auto; cursor:zoom-in}
  .shot .meta{display:flex; gap:7px; align-items:center; flex-wrap:wrap; padding:11px 12px; border-top:1px solid var(--line)}
  .mini{padding:5px 10px; border:1px solid var(--line); border-radius:999px; background:transparent;
    color:var(--fg); font:inherit; font-size:11.5px; cursor:pointer; transition:.12s}
  .mini:hover{background:var(--hover)}
  .mini.go{background:var(--ink); color:var(--ink-fg); border-color:transparent}
  .mini:disabled{opacity:.45; cursor:not-allowed}
  .mini.done{color:#1a7f4b; border-color:rgba(26,127,75,.35)}
  .tagfields{display:flex; flex-direction:column; gap:8px; padding:12px 12px 4px}
  .empty-chat{padding:44px 10px; text-align:center; color:var(--muted); font-size:12.5px; line-height:1.75}
  .empty-chat b{display:block; color:var(--fg); font-size:15px; font-weight:600; margin-bottom:6px}

  /* 输入区（ChatGPT 式：圆角容器、内嵌工具条、可展开） */
  .composer{position:relative; border-top:1px solid var(--line); padding:13px 16px 15px; background:var(--panel)}
  .cbox{border:1px solid var(--line); border-radius:16px; background:var(--bg); padding:9px 11px 8px;
    transition:border-color .14s, box-shadow .14s}
  .cbox:focus-within{border-color:var(--muted); box-shadow:0 1px 12px rgba(0,0,0,.06)}
  .cbox textarea{width:100%; border:0; outline:none; resize:none; background:transparent; color:inherit;
    font:inherit; font-size:13.5px; line-height:1.55; max-height:180px; min-height:22px; display:block}
  .ctools{display:flex; align-items:center; gap:5px; margin-top:7px}
  .ctool{height:27px; min-width:27px; padding:0 8px; border:1px solid var(--line); border-radius:8px;
    background:transparent; color:var(--muted); font:inherit; font-size:11.5px; cursor:pointer;
    display:flex; align-items:center; gap:5px; transition:.12s}
  .ctool:hover{background:var(--hover); color:var(--fg)}
  .ctool.on{background:var(--ink); color:var(--ink-fg); border-color:transparent}
  .csend{margin-left:auto; width:30px; height:30px; border:0; border-radius:50%; background:var(--ink);
    color:var(--ink-fg); cursor:pointer; display:grid; place-items:center; transition:.12s; flex:none}
  .csend:disabled{opacity:.3; cursor:not-allowed}
  .cnote{font-size:11px; color:var(--muted); margin-top:7px; line-height:1.5}

  /* 展开成近全屏编辑器 */
  #bigwrap[hidden]{display:none}
  #bigwrap{position:fixed; inset:0; z-index:80; display:flex; align-items:center; justify-content:center; padding:3vh 3vw}
  #bigwrap .mback{position:absolute; inset:0; background:var(--backdrop); backdrop-filter:blur(4px)}
  .bigpanel{position:relative; display:flex; flex-direction:column; width:min(920px,100%); height:94vh;
    background:var(--panel); border:1px solid var(--line); border-radius:18px; overflow:hidden;
    box-shadow:0 30px 90px rgba(0,0,0,.45)}
  .bighead{display:flex; align-items:center; gap:10px; padding:14px 18px; border-bottom:1px solid var(--line)}
  .bighead .t{font-size:14.5px; font-weight:600}
  .bigpanel textarea{flex:1; border:0; outline:none; resize:none; background:transparent; color:inherit;
    font:inherit; font-size:15px; line-height:1.7; padding:18px 20px}
  .bigfoot{display:flex; align-items:center; gap:8px; padding:12px 18px; border-top:1px solid var(--line)}
  .bigfoot .n{font-size:11.5px; color:var(--muted); margin-right:auto}

  /* 斜杠提示词菜单 */
  .slash{position:absolute; left:14px; right:14px; bottom:calc(100% - 4px); z-index:5; max-height:250px;
    overflow:auto; background:var(--panel); border:1px solid var(--line); border-radius:12px;
    box-shadow:0 12px 40px rgba(0,0,0,.22)}
  .slash .it{display:block; width:100%; text-align:left; padding:9px 12px; border:0; background:transparent;
    color:inherit; font:inherit; font-size:13px; cursor:pointer; border-bottom:1px solid var(--line)}
  .slash .it:last-child{border-bottom:0}
  .slash .it:hover,.slash .it.sel{background:var(--hover)}
  .slash .it .n{font-weight:600}
  .slash .it .p{font-size:11.5px; color:var(--muted); margin-top:2px; white-space:nowrap;
    overflow:hidden; text-overflow:ellipsis}
  .slash .none{padding:11px 12px; font-size:12.5px; color:var(--muted)}

    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
  .lib .it .ops{display:flex; gap:6px; align-items:center}
  .iconbtn{width:28px; height:28px; border:1px solid var(--line); border-radius:8px; background:transparent;
    color:var(--muted); cursor:pointer; display:grid; place-items:center; transition:.12s; flex:none}
  .iconbtn:hover{background:var(--hover); color:var(--fg); border-color:var(--muted)}
  .iconbtn.ok{color:#1a7f4b; border-color:rgba(26,127,75,.4)}
  .iconbtn.del{color:#fff; background:#e0392b; border-color:transparent}

  .lib .it .use{margin-right:auto; padding:5px 11px; width:auto; height:28px; border-radius:999px;
    font-size:11.5px; display:flex; gap:5px}

  .lbl{display:block; font-size:12px; font-weight:600; color:var(--muted); margin:14px 0 6px; letter-spacing:.02em}
  .lbl:first-child{margin-top:0}
  .fi{width:100%; font-family:inherit; font-size:13.5px; font-weight:450; padding:9px 11px; color:inherit;
    border:1px solid var(--line); border-radius:8px; background:var(--bg); outline:none}
  .fi:focus{border-color:var(--muted)}
  textarea.fi{resize:vertical; min-height:80px; line-height:1.55}
  select.fi{cursor:pointer}
  .hint{font-size:11.5px; color:var(--muted); margin-top:5px; line-height:1.55}
  .grp{border:1px solid var(--line); padding:13px; margin-bottom:12px}
  .grp .gt{font-size:13px; font-weight:600; margin-bottom:2px}
  .grp .gh{font-size:11.5px; color:var(--muted); margin-bottom:10px}
  .row2{display:flex; gap:8px}
  .row2>*{flex:1; min-width:0}
  .stat{font-size:12.5px; padding:9px 11px; margin-top:12px; border:1px solid var(--line); line-height:1.55}
  .stat.err{color:#e0392b; border-color:rgba(224,57,43,.32); background:rgba(224,57,43,.05)}
  .stat.ok{color:#1a7f4b; border-color:rgba(26,127,75,.3); background:rgba(26,127,75,.05)}
  .stat.busy{color:var(--muted)}
  .spin{display:inline-block; width:11px; height:11px; margin-right:7px; vertical-align:-1px;
    border:2px solid var(--line); border-top-color:var(--fg); border-radius:50%; animation:sp .7s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .picks{display:flex; flex-wrap:wrap; gap:5px; margin-top:9px}
  .pick{padding:4px 10px; border:1px solid var(--line); border-radius:999px; background:transparent;
    color:var(--muted); font:inherit; font-size:11.5px; cursor:pointer; transition:.12s}
  .pick:hover{border-color:var(--muted); color:var(--fg)}
  .pick.on{background:var(--ink); color:var(--ink-fg); border-color:transparent}
  /* 生成中：header 的 AI 按钮闪点，面板关着也知道后台在跑 */
  #aibtn .dot{display:none; width:7px; height:7px; border-radius:50%; background:currentColor}
  #aibtn.running .dot{display:inline-block; animation:pulse 1.1s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}
  @media(max-width:900px){

    body.ai-on header,body.ai-on nav.cats,body.ai-on main{padding-right:0}
    body.ai-on #fab{display:none}      /* 侧栏全屏时没地方让 */

  }

<script>
const API='/api';
let items=[], active='全部', query='';
let auth=localStorage.getItem('atlas.auth')||'';

const pillsEl=document.getElementById('pills'), grid=document.getElementById('grid'),
      empty=document.getElementById('empty'), modal=document.getElementById('modal'),
      panel=document.getElementById('mpanel'), fileInput=document.getElementById('file'),
      authBtn=document.getElementById('auth');

function wh(){const h={'Content-Type':'application/json'}; if(auth)h['Authorization']='Bearer '+auth; return h;}
function esc(t){return (t||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function cats(){const s=[];items.forEach(it=>{if(it.cat&&s.indexOf(it.cat)<0)s.push(it.cat);});return s;}

async function reload(){
  try{
    const r=await fetch(API+'/items',{headers:wh()});
    if(r.status===401){items=[];render();return on401(()=>boot());}
    items=r.ok?await r.json():[];
  }
  catch(e){items=[];}
  render();
}

function renderPills(){
  const list=['全部'].concat(cats());
  if(list.indexOf(active)<0) active='全部';
  pillsEl.innerHTML='';
  list.forEach(c=>{const b=document.createElement('button');
    b.className='chip'+(c===active?' on':''); b.textContent=c;
    b.onclick=()=>{active=c;render();}; pillsEl.appendChild(b);});
}
function makeCard(it){
  const fig=document.createElement('figure'); fig.className='card';
  fig.style.aspectRatio=(it.w||4)+' / '+(it.h||5);
  const img=new Image(); img.loading='lazy'; img.decoding='async'; img.alt=it.title||'';
  // 卡片只加载缩略图（宽 ~300px 的格子不该下 2MB 原图）；原图留到点开详情再取。
  // 加载完就撤掉 aspect-ratio 占位，让真实高度接管——元数据 w/h 缺失或不准的老图
  // 会因为回落默认 4/5 而在图片下方露出一条灰边。
  img.onload=()=>{img.classList.add('on'); fig.style.aspectRatio='';};
  img.src=it.thumb||it.src;
  fig.appendChild(img);
  fig.insertAdjacentHTML('beforeend',
    (auth?'<button class="del" title="删除"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg></button>':'')+
    '<div class="ov"><div><div class="ttl">'+esc(it.title||'未命名')+'</div>'+(it.cat?'<div class="mt">'+esc(it.cat)+'</div>':'')+'</div></div>');
  if(auth) fig.querySelector('.del').onclick=e=>{e.stopPropagation();del(it.id);};
  fig.onclick=()=>openDetail(it.id);
  return fig;
}
function renderGrid(){
  const q=query.toLowerCase();
  const list=items.filter(it=>(active==='全部'||it.cat===active)&&(!q
    ||(it.title||'').toLowerCase().includes(q)||(it.cat||'').toLowerCase().includes(q)||(it.keywords||'').toLowerCase().includes(q)));
  grid.innerHTML=''; list.forEach(it=>grid.appendChild(makeCard(it)));
  if(items.length===0){empty.hidden=false;empty.innerHTML='<div class="big">图库还是空的</div>'+(auth?'点右下角「上传」添加你的第一张图片':'登录后查看图库');}
  else if(list.length===0){empty.hidden=false;empty.innerHTML='<div class="big">没有匹配</div>换个关键词或分类试试';}
  else empty.hidden=true;
}
function render(){renderPills();renderGrid();}

/* ── 详情 / 下载 / 编辑 / 删除 ── */
function openDetail(id){
  const it=items.find(x=>x.id===id); if(!it)return;
  const tags=(it.keywords||'').split(/[,，\s]+/).filter(Boolean).map(k=>'<span class="tag">'+esc(k)+'</span>').join('');
  panel.classList.remove('narrow');
  // 先铺缩略图（多半已在缓存里，秒开），原图后台解码好再换上，避免点开一片空白
  panel.innerHTML=
    '<button class="mclose" data-x><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6 6 18"/></svg></button>'+
    '<div class="detail"><div class="imgwrap"><img id="dimg" src="'+(it.thumb||it.src)+'"></div>'+
    '<div class="side" id="dbody">'+
      '<div class="dt">'+esc(it.title||'未命名')+'</div>'+
      '<div class="dc">'+esc(it.cat||'未分类')+'</div>'+
      '<div class="tags">'+(tags||'<span class="dc">无关键词</span>')+'</div>'+
      '<div class="actions"><button class="btn pri" data-dl>下载</button>'+
        (auth?'<button class="btn" data-edit>编辑文字</button><button class="btn danger" data-del>删除</button>':'')+
      '</div>'+
    '</div></div>';
  panel.querySelector('[data-x]').onclick=close;
  panel.querySelector('[data-dl]').onclick=()=>download(it);
  if(auth){
    panel.querySelector('[data-edit]').onclick=()=>edit(it);
    panel.querySelector('[data-del]').onclick=()=>del(it.id);
  }
  if(it.thumb&&it.thumb!==it.src){
    const hi=new Image();
    hi.onload=()=>{const el=document.getElementById('dimg'); if(el)el.src=it.src;};
    hi.src=it.src;
  }
  modal.hidden=false;
}
function edit(it){
  document.getElementById('dbody').innerHTML=
    '<div class="mfields">'+
    '<input class="f" id="e-t" placeholder="标题" value="'+esc(it.title||'')+'">'+
    '<input class="f" id="e-c" placeholder="分类" value="'+esc(it.cat||'')+'" list="catlist">'+
    '<input class="f" id="e-k" placeholder="关键词（逗号分隔，用于搜索）" value="'+esc(it.keywords||'')+'">'+
    '</div><datalist id="catlist">'+cats().map(c=>'<option value="'+esc(c)+'">').join('')+'</datalist>'+
    '<div class="actions"><button class="btn pri" id="e-s">保存</button><button class="btn" id="e-c2">取消</button></div>';
  document.getElementById('e-s').onclick=async()=>{
    const body=JSON.stringify({title:document.getElementById('e-t').value.trim(),
      cat:document.getElementById('e-c').value.trim(),keywords:document.getElementById('e-k').value.trim()});
    const r=await fetch(API+'/items/'+it.id,{method:'PUT',headers:wh(),body});
    if(r.status===401){return on401(()=>{openDetail(it.id);edit(items.find(x=>x.id===it.id)||it);});}
    await reload(); openDetail(it.id);
  };
  document.getElementById('e-c2').onclick=()=>openDetail(it.id);
}
function download(it){
  fetch(it.src).then(r=>r.blob()).then(b=>{const u=URL.createObjectURL(b),a=document.createElement('a');
    a.href=u;a.download=(it.title||'image').replace(/[^\w一-龥-]+/g,'_')+'.jpg';
    document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(u);})
   .catch(()=>{const a=document.createElement('a');a.href=it.src;a.target='_blank';a.click();});
}
async function del(id){
  if(!auth) return openLogin(()=>del(id));
  if(!confirm('删除这张图片？'))return;
  const r=await fetch(API+'/items/'+id,{method:'DELETE',headers:wh()});
  if(r.status===401){return on401(()=>del(id));}
  await reload(); if(!modal.hidden)close();
}
function close(){modal.hidden=true;panel.innerHTML='';panel.classList.remove('narrow');}
modal.querySelector('.mback').onclick=close;
document.addEventListener('keydown',e=>{if(e.key!=='Escape')return;
  if(!modal.hidden)return close();
  if(!bigWrap.hidden)return closeBig();
  if(!aiSide.hidden)closeAi();});

/* ── 登录 ──
   图库整体私有：未登录看不到列表也取不到图（服务端强制，前端这层只是体验）。 */
function setAuth(t){auth=t||''; if(t)localStorage.setItem('atlas.auth',t); else localStorage.removeItem('atlas.auth');
  authBtn.textContent=auth?'退出':'登录';
  // 退出即刻抹掉内存里的图库，否则已渲染的缩略图还留在屏幕上
  // 退出即刻抹掉内存里的图库和这段 AI 对话，否则旧缩略图还留在屏幕上
  if(!auth){items=[]; aiAllowed=false; chat=[]; sessions=[]; curSid=''; fullImg.clear();
    localStorage.removeItem(CHATKEY); localStorage.removeItem(JOBKEY); claimed.clear();
    clearInterval(aiPoll); aiPoll=null;
    document.getElementById('aibtn').hidden=true; closeAi(); if(!modal.hidden)close();}
  render();}
function on401(retry){setAuth(''); items=[]; render(); openLogin(retry);}

/* 启动：先问「我是谁」——决定放不放行图库、显不显示 AI 入口。 */
async function boot(){
  if(!auth){items=[];render();return openLogin(()=>boot());}
  let me=null;
  try{const r=await fetch(API+'/me',{headers:wh()}); if(r.ok) me=await r.json();}catch(e){}
  if(!me){return on401(()=>boot());}
  aiAllowed=!!me.ai;
  document.getElementById('aibtn').hidden=!aiAllowed;
  document.getElementById('aiwho').textContent=me.user;
  authBtn.textContent='退出';
  loginPage.hidden=true;
  await reload();
  backfillThumbs();
  // 刷新页面 / 换台设备登录后，把还在后台跑的那张图接回来
  if(aiAllowed)syncState();
}

/* 老图没有缩略图（是加缩略图机制之前入库的），登录后在后台逐张补齐：
   取原图 → canvas 压 → 回传。串行且低优先，补完这张图以后就一直走缩略图了。 */
async function backfillThumbs(){
  const todo=items.filter(it=>!it.thumb||it.thumb===it.src);
  if(!todo.length)return;
  for(const it of todo){
    try{
      const blob=await (await fetch(it.src,{headers:wh()})).blob();
      const url=URL.createObjectURL(blob);
      const t=await thumbFor(url);
      URL.revokeObjectURL(url);
      if(!t.thumb)continue;
      await fetch(API+'/thumb/'+it.id,{method:'POST',headers:wh(),
        body:JSON.stringify({thumbURL:t.thumb,w:t.w,h:t.h})});
    }catch(e){ /* 单张失败不影响其余，下次登录再试 */ }
  }
  await reload();
}
const loginPage=document.getElementById('loginpage');
let loginAfter=null;
function openLogin(after){
  loginAfter=after||null;
  document.getElementById('lu').value='';
  document.getElementById('lp').value='';
  document.getElementById('lerr').textContent='';
  loginPage.hidden=false;
  setTimeout(()=>document.getElementById('lu').focus(),30);
}
document.getElementById('loginbox').onsubmit=async(e)=>{
  e.preventDefault();
  const lerr=document.getElementById('lerr'); lerr.textContent='';
  const r=await fetch(API+'/login',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({user:document.getElementById('lu').value.trim(),pass:document.getElementById('lp').value})});
  if(r.ok){const d=await r.json(); setAuth(d.token); loginPage.hidden=true; const a=loginAfter; loginAfter=null; a?a():boot();}
  else{const d=await r.json().catch(()=>({})); lerr.textContent=d.error||'账号或密码错误';}
};
authBtn.onclick=async()=>{
  if(!auth) return openLogin();
  if(!confirm('退出登录？'))return;
  // 会话 Cookie 是 HttpOnly 的（<img> 取图要用），JS 删不掉，必须让服务端清
  try{await fetch(API+'/logout',{method:'POST',headers:wh()});}catch(e){}

/* ── AI 生图工作台 ─────────────────────────────────────────────
   只有服务端 AI 白名单里的账号才拿得到入口；前端隐藏只是体验，
   /api/ai/* 每一次都会再校验一遍身份。

   生图跑在服务端后台线程，这里只轮询 /api/ai/state。所以收起面板、切标签页、
   甚至刷新页面，那张图都还在生成，回来就能接上——否则连接一断，额度已经扣了，
   图却拿不回来。 */
const AIKEY='atlas.ai', CHATKEY='atlas.ai.chat', LIBKEY='atlas.ai.lib';
let aiAllowed=false, aiTab='gen', aiSys={}, aiBusy=false, aiPoll=null, aiPicks=[], pendingTpl='';
let chat=[];                      // [{id,role:'u'|'a',text,thumb,revised,model,via,title,cat,keywords,itemId}]
const fullImg=new Map();          // id → 原图 dataURL（只在内存；localStorage 存不下几 MB 的图）
const claimed=new Set();          // 已认领的 job id，防并发轮询把同一张图插两次
const JOBKEY='atlas.ai.job';
/* 服务端的生成状态是全局长驻的：不锁定「这是我这次发起的 job」，登录时就会把很久以前
   那次的 done 结果又认领一遍，凭空多出一张旧图。存 localStorage 是为了刷新后还认得。 */
const myJob=()=>localStorage.getItem(JOBKEY)||'';
const setMyJob=j=>j?localStorage.setItem(JOBKEY,j):localStorage.removeItem(JOBKEY);
const aiSide=document.getElementById('aiside'), aiBody=document.getElementById('aibody'),
      composer=document.getElementById('composer'), cin=document.getElementById('c-in'),
      cnote=document.getElementById('c-note'), aiBtn=document.getElementById('aibtn');

function aiCfg(){try{return JSON.parse(localStorage.getItem(AIKEY))||{};}catch(e){return {};}}
function aiCreds(){const c=aiCfg();return{baseUrl:(c.baseUrl||'').trim(),apiKey:(c.apiKey||'').trim()};}
function aiSplit(s){return (s||'').split(/[,，]/).map(x=>x.trim()).filter(Boolean);}
/* 自己填的优先。留空才回落服务器默认——但仅限「接口也没自定义」时：
   换了自己的网关，服务器那套模型名（属于另一个网关）拿过去必然打不通。 */
function aiOwnGateway(){return !!(aiCfg().baseUrl||'').trim();}
function aiModels(){const l=aiSplit(aiCfg().imageModels);
  return l.length?l:(aiOwnGateway()?[]:(aiSys.imageModels||[]));}
function curModel(){const ms=aiModels(), m=aiCfg().model;
  return ms.indexOf(m)>=0?m:(ms[0]||'');}

async function aiPost(path,body){
  const r=await fetch(API+'/ai/'+path,{method:'POST',headers:wh(),
    body:JSON.stringify(Object.assign(aiCreds(),body||{}))});
  const d=await r.json().catch(()=>({}));
  if(r.status===401){on401(()=>boot());throw new Error('登录已过期');}
  if(!r.ok&&r.status!==202)throw new Error(d.error||('HTTP '+r.status));
  return d;
}
async function aiGet(path){
  const r=await fetch(API+'/ai/'+path,{headers:wh()});
  const d=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(d.error||('HTTP '+r.status));
  return d;
}

/* ── 会话与历史 ────────────────────────────────────────────────
   模型跟本系统的 AiChat 一致：一条会话 = 一个对话线程，标题由首条用户消息截断生成，
   按更新时间倒序。会话之间互相隔离，新建不会动到旧的。
   一张生成图 2MB+，localStorage 总共才 5–10MB，所以持久化的是缩略图
   （长边 320 的 JPEG，约 20KB）；原图只在内存，刷新后没了，已入库的可以从图库看。 */
const MAX_SESS=20, MAX_MSG=40;
let sessions=[], curSid='';
function sessLoad(){
  try{const d=JSON.parse(localStorage.getItem(CHATKEY))||{};
    sessions=Array.isArray(d.sessions)?d.sessions:[];
    curSid=d.cur||'';
  }catch(e){sessions=[];curSid='';}
  if(!sessions.length){newSession(true);}
  else if(!sessions.some(s=>s.id===curSid))curSid=sessions[0].id;
  chat=(sessions.find(s=>s.id===curSid)||{msgs:[]}).msgs;
}
function sessSave(){
  const s=sessions.find(x=>x.id===curSid);
  if(s){s.msgs=chat; s.ts=Date.now();
    // 标题取首条用户消息，和本系统 AiChat.title 的生成方式一致
    if(!s.named){const u=chat.find(m=>m.role==='u');
      if(u){s.title=u.text.slice(0,20)+(u.text.length>20?'…':'');s.named=true;}}}
  sessions.sort((a,b)=>b.ts-a.ts);
  sessions=sessions.slice(0,MAX_SESS);
  const write=()=>localStorage.setItem(CHATKEY,JSON.stringify({cur:curSid,sessions}));
  try{write();}
  catch(e){ // 配额爆了：先砍每会话消息数，再砍会话数，实在不行只留当前这条
    sessions.forEach(x=>x.msgs=x.msgs.slice(-10));
    try{write();}catch(e2){
      sessions=sessions.filter(x=>x.id===curSid);
      try{write();}catch(e3){}
    }
  }
}
function chatSave(){sessSave();}
function newSession(silent){
  const id='s'+Date.now()+Math.random().toString(36).slice(2,6);
  sessions.unshift({id,title:'新会话',ts:Date.now(),named:false,msgs:[]});
  curSid=id; chat=sessions[0].msgs;
  if(!silent){sessSave(); aiTab='gen'; aiRender(); setTimeout(()=>cin&&cin.focus(),50);}
}
function switchSession(id){
  const s=sessions.find(x=>x.id===id); if(!s)return;
  curSid=id; chat=s.msgs; sessSave(); aiTab='gen'; aiRender();
}
function delSession(id){
  const i=sessions.findIndex(x=>x.id===id); if(i<0)return;
  sessions[i].msgs.forEach(m=>fullImg.delete(m.id));
  sessions.splice(i,1);
  if(!sessions.length)newSession(true);
  if(!sessions.some(x=>x.id===curSid))curSid=sessions[0].id;
  chat=sessions.find(x=>x.id===curSid).msgs;
  sessSave(); aiRender();
}
function thumbOf(dataURL){
  return new Promise(res=>{const i=new Image();
    i.onload=()=>{const s=320/Math.max(i.naturalWidth,i.naturalHeight,1), sc=Math.min(1,s);
      const cv=document.createElement('canvas');
      cv.width=Math.max(1,Math.round(i.naturalWidth*sc)); cv.height=Math.max(1,Math.round(i.naturalHeight*sc));
      cv.getContext('2d').drawImage(i,0,0,cv.width,cv.height);
      res({thumb:cv.toDataURL('image/jpeg',.72),w:i.naturalWidth,h:i.naturalHeight});};
    i.onerror=()=>res({thumb:'',w:0,h:0}); i.src=dataURL;});
}
/* 缩略图只在真的更小时才用：本来就很小的图（图标、纯色块）压成 JPEG 可能反而变大，
   那就不生成，让它直接走原图——服务端 out_item 会自动回落。 */
async function thumbFor(dataURL){
  const t=await thumbOf(dataURL);
  if(t.thumb&&t.thumb.length>=dataURL.length)t.thumb='';
  return t;
}

/* 展示用大图：内存里有原图就用原图，否则退回缩略图 */
function srcOf(m){return fullImg.get(m.id)||m.thumb||'';}
function lastShot(){for(let i=chat.length-1;i>=0;i--)if(chat[i].role==='a')return chat[i];return null;}

/* ── 面板开关（挤压式，不遮盖主页面）── */
async function openAi(){

}
function closeAi(){ aiSide.hidden=true; document.body.classList.remove('ai-on'); }

aiBtn.onclick=()=>aiSide.hidden?openAi():closeAi();
document.getElementById('aix').onclick=closeAi;
/* 拖左边缘调宽度：只改 --aiw，主内容的 padding 是由它算出来的，所以拖动即实时挤压 */
const WKEY='atlas.ai.w';
function setAiW(px){
  const w=Math.round(Math.max(340,Math.min(px,Math.min(900,innerWidth*0.72))));
  document.documentElement.style.setProperty('--aiw',w+'px');
  return w;
}
(function(){
  const saved=parseInt(localStorage.getItem(WKEY)||'',10);
  if(saved&&innerWidth>900)setAiW(saved);
  const grip=document.getElementById('aigrip');
  let on=false;
  grip.addEventListener('pointerdown',e=>{
    if(innerWidth<=900)return;                 // 窄屏是全宽面板，没得拉
    on=true; grip.setPointerCapture(e.pointerId);
    document.body.classList.add('aidrag'); e.preventDefault();
  });
  grip.addEventListener('pointermove',e=>{ if(on)setAiW(innerWidth-e.clientX); });
  const stop=()=>{ if(!on)return; on=false; document.body.classList.remove('aidrag');
    localStorage.setItem(WKEY,parseInt(getComputedStyle(document.documentElement).getPropertyValue('--aiw'),10)||420); };
  grip.addEventListener('pointerup',stop);
  grip.addEventListener('pointercancel',stop);
  grip.addEventListener('dblclick',()=>{setAiW(420);localStorage.setItem(WKEY,420);});
})();

/* 加号 = 新开一条会话（旧的原样留在历史里），不是清空当前对话 */
document.getElementById('ainew').onclick=()=>{

function fmtTime(ts){
  const d=new Date(ts), n=new Date(), pad=x=>String(x).padStart(2,'0');
  const sameDay=d.toDateString()===n.toDateString();
  return sameDay?('今天 '+pad(d.getHours())+':'+pad(d.getMinutes()))
                :(pad(d.getMonth()+1)+'-'+pad(d.getDate())+' '+pad(d.getHours())+':'+pad(d.getMinutes()));
}
function histHTML(){
  return '<div class="hint">每条会话互相独立，切换不会丢上下文。只存在你这台设备的浏览器里，最多保留 '+MAX_SESS+' 条。</div>'+
    '<button class="libnew" id="h-new" style="margin-top:14px">'+ICON.plus+'新建会话</button>'+

        '<div class="p">'+fmtTime(s.ts)+' · '+s.msgs.length+' 条消息 · '+imgs+' 张图</div>'+
        '<div class="ops"><button class="iconbtn use" data-s="'+s.id+'" data-a="open">'+ICON.arrow+'打开</button>'+
        '<button class="iconbtn del" data-s="'+s.id+'" data-a="del" title="删除会话">'+ICON.trash+'</button></div></div>';
    }).join('')+'</div>';
}
function bindHist(){
  document.getElementById('h-new').onclick=()=>newSession();

/* ── 对话流 ── */
function renderChat(){
  const ms=aiModels();
  if(!ms.length){
    aiBody.innerHTML='<div class="stat err">'+(aiOwnGateway()
      ? '你填了自己的接口地址，就必须同时填「生图模型」——模型名跟着网关走，服务器默认那组属于另一个网关，拿过来打不通。'
      : '还没有可用的生图模型，去「设置」里填一个。')+'</div>';
    return;
  }
  if(!chat.length){
    aiBody.innerHTML='<div class="empty-chat"><b>说一句，画一张</b>'+
      '描述你想要的画面，出图后可以接着说「背景换成夜晚」<br>它会带着上一张图和这段对话继续改。<br><br>'+
      '输入 <b style="display:inline;font-size:12.5px">/</b> 可以调用提示词库。</div>';
    return;
  }
  const box=document.createElement('div'); box.className='msgs';
  chat.forEach(m=>box.appendChild(m.role==='u'?userNode(m):shotNode(m)));
  aiBody.innerHTML=''; aiBody.appendChild(box);
  aiBody.scrollTop=aiBody.scrollHeight;
}
function userNode(m){
  const d=document.createElement('div'); d.className='msg u'; d.textContent=m.text; return d;
}
function shotNode(m){
  const d=document.createElement('div'); d.className='msg a';
  const src=srcOf(m), has=!!fullImg.get(m.id);
  d.innerHTML=(m.tpl?'<div class="tplbadge">'+esc(m.tpl)+'</div>':'')+
    (m.revised?'<div class="rp">'+esc(m.revised)+'</div>':'')+
    '<div class="shot">'+(src?'<img src="'+src+'" alt="">':'')+
      '<div class="tagfields">'+
        '<input class="fi" data-f="title" placeholder="标题" value="'+esc(m.title||'')+'">'+
        '<div class="row2">'+
          '<input class="fi" data-f="cat" placeholder="分类" list="catlist3" value="'+esc(m.cat||'')+'">'+
          '<input class="fi" data-f="keywords" placeholder="关键词" value="'+esc(m.keywords||'')+'">'+
        '</div>'+
      '</div>'+
      '<div class="meta">'+
        '<button class="mini" data-a="tag"'+(has?'':' disabled')+'>AI 分类</button>'+
        '<button class="mini" data-a="edit">继续改这张</button>'+
        (m.itemId?'<button class="mini done" data-a="open">✓ 已入库</button>'
                 :'<button class="mini go" data-a="add"'+(has?'':' disabled')+'>加入图库</button>')+
        '<span class="mini" style="border:0;color:var(--muted);cursor:default">'+esc(m.model||'')+(m.via?' · '+esc(m.via):'')+'</span>'+
      '</div>'+
    '</div><datalist id="catlist3">'+cats().map(c=>'<option value="'+esc(c)+'">').join('')+'</datalist>';
  const img=d.querySelector('img');
  if(img)img.onclick=()=>zoom(m);
  d.querySelectorAll('[data-f]').forEach(el=>el.onchange=()=>{
    m[el.dataset.f]=el.value.trim(); chatSave();});
  d.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{
    const a=b.dataset.a;
    if(a==='tag')autoTag(m);
    else if(a==='add')addToGallery(m);
    else if(a==='open'){closeAi();openDetail(m.itemId);}
    else if(a==='edit'){cin.value='';cin.placeholder='说说这张要怎么改…';cin.focus();}
  });
  return d;
}
/* 点图放大：复用图库那套 modal */
function zoom(m){
  const src=srcOf(m); if(!src)return;
  panel.classList.remove('narrow');
  panel.innerHTML='<button class="mclose" data-x><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6 6 18"/></svg></button>'+
    '<div class="detail"><div class="imgwrap"><img src="'+src+'"></div>'+
    '<div class="side"><div class="dt">'+esc(m.title||'未命名')+'</div>'+
    '<div class="dc">'+esc(m.model||'')+(m.via?' · '+esc(m.via):'')+(fullImg.get(m.id)?'':' · 原图已随刷新丢失，这是缩略图')+'</div>'+
    (m.revised?'<div class="tags" style="font-size:12.5px;color:var(--muted);line-height:1.6">'+esc(m.revised)+'</div>':'')+
    '<div class="actions"><button class="btn pri" data-dl>下载</button></div></div></div>';
  panel.querySelector('[data-x]').onclick=close;
  panel.querySelector('[data-dl]').onclick=()=>{
    const a=document.createElement('a'); a.href=src;
    a.download=(m.title||'ai-image').replace(/[^\w一-龥-]+/g,'_')+'.png';
    document.body.appendChild(a); a.click(); a.remove();};

/* ── 发送：优化提示词 → 启动后台生图 → 轮询 ── */
function note(t,kind){cnote.innerHTML=t?((kind==='busy'?'<span class="spin"></span>':'')+esc(t)):'';
  cnote.style.color=kind==='err'?'#e0392b':'';}
function setBusy(b){
  aiBusy=b;
  document.getElementById('c-go').disabled=b;
  aiBtn.classList.toggle('running',b);
}
async function send(){
  const text=cin.value.trim();
  if(!text)return;
  if(aiBusy)return note('已有一张在生成中，等它完成（避免重复计费）','err');
  const ms=aiModels(); if(!ms.length){aiTab='cfg';return aiRender();}
  cin.value=''; autoGrow();
  chat.push({id:'u'+Date.now(),role:'u',text}); chatSave(); renderChat();
  setBusy(true);
  let prompt=text;
  try{
    if(document.getElementById('c-opt').classList.contains('on')){
      note('正在挑模板、优化提示词…','busy');
      const prev=lastShot();
      const d=await aiPost('prompt',{input:text,
        turns:chat.slice(-7).map(m=>({role:m.role==='a'?'image':'user',text:m.role==='a'?(m.revised||m.text||''):m.text})),
        dataURL:prev?fullImg.get(prev.id)||'':'',
        // 接着改同一张图时沿用上一轮的模板，别中途换风格体系
        template:prev?(prev.template||''):'', keepTemplate:!!prev});
      prompt=d.prompt||text;
      pendingTpl=d.templateTitle||'';
      if(pendingTpl)note('已选模板「'+pendingTpl+'」，提交生成中…','busy');
    }else pendingTpl='';
    note('已提交，后台生成中…','busy');
    const started=await aiPost('image',{prompt,model:curModel(),size:aiCfg().size||'1024x1024'});
    setMyJob(started.job||'');
    startPoll();
  }catch(e){
    setBusy(false); note(String(e.message||e),'err');
  }
}
function startPoll(){
  clearInterval(aiPoll);
  aiPoll=setInterval(syncState,2000);
  syncState();
}
/* 唯一的真相来源是服务端状态：刷新页面、换设备、重开面板都靠它接回来。
   自身防重入：boot / openAi / 定时器都会调它，重入会并发跑同一段结果处理。 */
let syncing=false;
async function syncState(){ if(syncing)return; syncing=true;
  try{ await syncStateInner(); } finally { syncing=false; }
}
async function syncStateInner(){
  let s; try{s=await aiGet('state');}catch(e){return;}
  if(s.status==='running'&&s.job===myJob()){
    setBusy(true);
    if(!aiPoll)startPoll();
    note('生成中… 已 '+s.elapsed+' 秒，可以收起面板或做别的，不会中断','busy');
    return;
  }
  clearInterval(aiPoll); aiPoll=null;
  if(s.job!==myJob()){setBusy(false);return;}          // 不是我这次发起的，不认领
  if(s.status==='error'){setMyJob('');setBusy(false);return note(s.error||'生成失败','err');}
  if(s.status==='done'&&s.ready){
    // 按服务端的 job id 去重：同一句提示词再生成一次是正常操作，不能拿 prompt 当 key。
    // claimed 必须在 await 之前同步占位——boot / openAi / 轮询都会调进来，
    // 只查 chat 的话两个并发调用会同时通过检查，同一张图被插两次。
    if(claimed.has(s.job)||chat.some(m=>m.job&&m.job===s.job)){setBusy(false);return;}
    claimed.add(s.job);
    try{
      const r=await aiGet('result');
      const {thumb}=await thumbOf(r.dataURL);
      const id='a'+Date.now();
      fullImg.set(id,r.dataURL);
      const m={id,role:'a',text:r.prompt||'',revised:r.revised_prompt||r.prompt||'',
               thumb,model:r.model||'',via:r.via||'',title:'',cat:'',keywords:'',
               tpl:pendingTpl,job:s.job};
      pendingTpl='';
      setMyJob('');                                     // 结果已消费，别再认领第二次
      chat.push(m); chatSave(); renderChat();
      setBusy(false); note('生成完成（'+s.elapsed+' 秒）');
      autoTag(m);
    }catch(e){claimed.delete(s.job);setBusy(false);note('取结果失败：'+(e.message||e),'err');}
    return;
  }
  setBusy(false);
}

/* 视觉小模型当分类 agent：看图 → 标题/分类/关键词，并把现有分类喂给它以便复用 */
async function autoTag(m){
  const src=fullImg.get(m.id); if(!src)return;
  note('AI 正在看图分类…','busy');
  try{
    const d=await aiPost('tag',{dataURL:src,cats:cats().join(',')});
    Object.assign(m,{title:d.title||'',cat:d.cat||'',keywords:d.keywords||''});
    chatSave(); renderChat(); note('已自动填好标题分类，可改后入库');
  }catch(e){note('自动分类失败：'+(e.message||e),'err');}
}

async function addToGallery(m){
  const src=fullImg.get(m.id);
  if(!src)return note('原图已随页面刷新丢失，无法入库','err');
  note('正在加入图库…','busy');
  try{
    // 必须带上真实宽高：卡片用 aspect-ratio 占位，缺了就回落默认 4/5，
    // 方图会被拉成 4:5，底下露出一条灰边。
    const {w,h,thumb}=await thumbFor(src);
    const r=await fetch(API+'/upload',{method:'POST',headers:wh(),body:JSON.stringify(
      {dataURL:src,thumbURL:thumb,w,h,title:m.title||'AI 生成',cat:m.cat||'',keywords:m.keywords||''})});
    if(r.status===401)return on401(()=>boot());
    const d=await r.json().catch(()=>({}));
    if(!r.ok)throw new Error(d.error||('HTTP '+r.status));
    m.itemId=d.id; chatSave();
    await reload(); renderChat(); note('已加入图库');
  }catch(e){note('入库失败：'+(e.message||e),'err');}
}

/* ── 输入框：自增高、Enter 发送、放大编辑、/ 唤起提示词库 ── */
function autoGrow(){cin.style.height='auto';cin.style.height=Math.min(180,cin.scrollHeight)+'px';}
cin.addEventListener('input',()=>{autoGrow();slashUpdate();});
cin.addEventListener('keydown',e=>{
  const menu=document.getElementById('slash').firstChild;
  if(menu&&menu.className==='slash'){
    const its=[...menu.querySelectorAll('.it')];
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){
      e.preventDefault();
      let i=its.findIndex(x=>x.classList.contains('sel'));
      i=(i+(e.key==='ArrowDown'?1:-1)+its.length)%(its.length||1);
      its.forEach(x=>x.classList.remove('sel')); if(its[i]){its[i].classList.add('sel');its[i].scrollIntoView({block:'nearest'});}
      return;
    }
    if(e.key==='Enter'&&its.length){e.preventDefault();(its.find(x=>x.classList.contains('sel'))||its[0]).click();return;}
    if(e.key==='Escape'){slashClose();return;}
  }
  if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();send();}
});
document.getElementById('c-go').onclick=send;
document.getElementById('c-opt').onclick=e=>{
  const on=e.currentTarget.classList.toggle('on');
  localStorage.setItem('atlas.ai.opt',on?'1':'0');
  note(on?'开启后：先让小模型把你的话扩写成完整提示词，再拿去生图':'关闭后：原样把你写的文字送去生图');
};
if(localStorage.getItem('atlas.ai.opt')!=='0')document.getElementById('c-opt').classList.add('on');

/* 同一个近全屏编辑器服务两种场景：放大写对话提示词，以及新建/编辑提示词库条目 */
const bigWrap=document.getElementById('bigwrap'), bigT=document.getElementById('big-t'),
      bigName=document.getElementById('big-name'), bigNameRow=document.getElementById('big-namerow');
let bigMode={type:'composer'};
function bigCount(){document.getElementById('big-n').textContent=bigT.value.length+' 字';}
function openBig(mode){
  bigMode=mode||{type:'composer'};
  const lib=bigMode.type==='lib', l=libLoad(), p=lib&&bigMode.index>=0?l[bigMode.index]:null;
  bigNameRow.hidden=!lib;
  document.getElementById('big-title').textContent=lib?(p?'编辑提示词':'新建提示词'):'编辑提示词';
  document.getElementById('big-ok').textContent=lib?'保存':'用这段';
  bigName.value=p?p.name:'';
  bigT.value=lib?(p?p.text:''):cin.value;
  bigT.placeholder=lib?'提示词正文…':'在这里从容地写长提示词…';
  bigWrap.hidden=false; bigCount();
  setTimeout(()=>(lib&&!p?bigName:bigT).focus(),40);
}
function closeBig(){bigWrap.hidden=true;}
document.getElementById('c-big').onclick=()=>openBig({type:'composer'});
document.getElementById('big-x').onclick=closeBig;
document.getElementById('big-cancel').onclick=closeBig;
bigWrap.querySelector('.mback').onclick=closeBig;
bigT.addEventListener('input',bigCount);
document.getElementById('big-ok').onclick=()=>{
  if(bigMode.type==='lib'){
    const n=bigName.value.trim(), t=bigT.value.trim();
    if(!n||!t)return alert('标题和正文都要填');
    const l=libLoad();
    if(bigMode.index>=0)l[bigMode.index]={name:n,text:t}; else l.unshift({name:n,text:t});
    libSave(l); closeBig(); aiTab='lib'; aiRender(); return;
  }
  cin.value=bigT.value; closeBig(); autoGrow(); cin.focus();
};

/* ── 提示词库 ── */
function libLoad(){try{return JSON.parse(localStorage.getItem(LIBKEY))||[];}catch(e){return [];}}
function libSave(l){localStorage.setItem(LIBKEY,JSON.stringify(l));}
function slashClose(){document.getElementById('slash').innerHTML='';}
function slashUpdate(){
  const v=cin.value, at=cin.selectionStart;
  const line=v.slice(0,at), m=line.match(/(?:^|\s)\/([^\s/]*)$/);
  if(!m)return slashClose();
  const q=(m[1]||'').toLowerCase();
  const hits=libLoad().filter(p=>!q||p.name.toLowerCase().includes(q)||p.text.toLowerCase().includes(q));
  const box=document.createElement('div'); box.className='slash';
  if(!hits.length){box.innerHTML='<div class="none">提示词库还是空的，去「提示词库」标签添加</div>';}
  else hits.slice(0,20).forEach((p,i)=>{
    const b=document.createElement('button'); b.className='it'+(i===0?' sel':'');
    b.innerHTML='<div class="n">'+esc(p.name)+'</div><div class="p">'+esc(p.text)+'</div>';
    b.onclick=()=>{
      const before=v.slice(0,at).replace(/(?:^|\s)\/[^\s/]*$/,mm=>mm.startsWith(' ')?' ':'');
      cin.value=before+p.text+v.slice(at);
      slashClose(); cin.focus(); autoGrow();
      cin.selectionStart=cin.selectionEnd=(before+p.text).length;
    };
    box.appendChild(b);
  });
  const s=document.getElementById('slash'); s.innerHTML=''; s.appendChild(box);
}
document.addEventListener('click',e=>{
  if(!composer.hidden&&!composer.contains(e.target))slashClose();
});

const ICON={
  plus:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>',
  copy:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>',
  check:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M4 12.5 9 17.5 20 6.5"/></svg>',
  edit:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20h4L19 9l-4-4L4 16v4z"/><path d="M14 6l4 4"/></svg>',
  trash:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>',
  arrow:'<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M5 12h14M13 6l6 6-6 6"/></svg>'
};
function libHTML(){
  const l=libLoad();
  return '<div class="hint">存好常用提示词，在对话框输入 <b>/</b> 就能直接调用。只存在你这台设备的浏览器里。</div>'+
    '<button class="libnew" id="l-new" style="margin-top:14px">'+ICON.plus+'新建提示词</button>'+
    '<div class="lib">'+(l.length?l.map((p,i)=>
      '<div class="it"><div class="n">'+esc(p.name)+'</div><div class="p">'+esc(p.text)+'</div>'+
      '<div class="ops">'+
        '<button class="iconbtn use" data-i="'+i+'" data-a="use" title="填入对话框">'+ICON.arrow+'填入</button>'+
        '<button class="iconbtn" data-i="'+i+'" data-a="copy" title="复制">'+ICON.copy+'</button>'+
        '<button class="iconbtn" data-i="'+i+'" data-a="edit" title="编辑">'+ICON.edit+'</button>'+
        '<button class="iconbtn del" data-i="'+i+'" data-a="del" title="删除">'+ICON.trash+'</button>'+
      '</div></div>').join('')
      :'<div class="hint">还没有提示词，点上面新建一条。</div>')+'</div>';
}
function bindLib(){
  document.getElementById('l-new').onclick=()=>openBig({type:'lib',index:-1});
  aiBody.querySelectorAll('[data-a]').forEach(b=>b.onclick=async()=>{
    const l=libLoad(), i=+b.dataset.i, p=l[i]; if(!p)return;
    const a=b.dataset.a;
    if(a==='use'){aiTab='gen';aiRender();cin.value=p.text;autoGrow();cin.focus();}
    else if(a==='copy'){
      try{await navigator.clipboard.writeText(p.text);}
      catch(e){ // 非安全上下文下 clipboard API 不可用，退回老办法
        const ta=document.createElement('textarea'); ta.value=p.text;
        ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta);
        ta.select(); try{document.execCommand('copy');}catch(e2){} ta.remove();
      }
      b.classList.add('ok'); b.innerHTML=ICON.check;
      setTimeout(()=>{b.classList.remove('ok');b.innerHTML=ICON.copy;},1300);
    }
    else if(a==='edit'){openBig({type:'lib',index:i});}
    else if(a==='del'){ if(!confirm('删除「'+p.name+'」？'))return; l.splice(i,1); libSave(l); aiRender(); }
  });
}

         : (def?'服务器默认 '+esc(def):'<b style="color:#e0392b">无</b>')))+'</div>';
  return '<div class="hint">兼容 OpenAI 接口，直接手填即可。留空的项才用服务器默认'+
      (aiSys.keyCount?'（已配 '+aiSys.keyCount+' 个 Key 轮换）':'')+

      '<div class="gh">可换成任意 OpenAI 兼容站；留空 = 走服务器默认线路</div>'+
      '<label class="lbl">Base URL</label><input class="fi" id="c-b" placeholder="留空 = 走服务器默认线路" value="'+esc(c.baseUrl||'')+'">'+
      '<label class="lbl">API Key</label><input class="fi" id="c-k" type="password" autocomplete="new-password" placeholder="'+
        (aiSys.keyCount?'留空 = 服务器默认的 '+aiSys.keyCount+' 个 Key':'sk-…')+'" value="'+esc(c.apiKey||'')+'">'+
      '<div class="hint">多个 Key 用英文逗号分隔，每次请求轮换；某个 Key 被拒会自动换下一个。<br>'+
      '你这条线路失败时会自动回落服务器默认线路——但仅限「明确被拒 / 连不上」，'+
      '超时或 5xx 不回落，因为那时上游可能已经在出图并已扣费，再打一条就是两边都扣。</div></div>'+
    '<div class="grp"><div class="gt">生图模型</div>'+
      '<div class="gh">自己填模型名，多个用逗号分隔 → 下面下拉切换</div>'+
      '<input class="fi" id="c-i" placeholder="'+(own?'例：gpt-image-2, flux-pro':'留空 = 服务器默认（'+esc(dflt||'无')+'）')+'" value="'+esc(c.imageModels||'')+'">'+
      src(c.imageModels,dflt)+
      (ms.length?'<label class="lbl">本次使用</label><select class="fi" id="c-m">'+
        ms.map(m=>'<option'+(m===curModel()?' selected':'')+'>'+esc(m)+'</option>').join('')+'</select>':'')+

        ['1024x1024','1536x1024','1024x1536'].map(s=>'<option'+(s===(c.size||'1024x1024')?' selected':'')+'>'+s+'</option>').join('')+'</select>'+
      '<button class="btn" id="c-pull" style="width:100%;margin-top:10px;font-size:12.5px;padding:7px 0">不知道有哪些？从接口拉一份（可选）</button>'+
      (aiPicks.length?'<div class="picks">'+aiPicks.map(m=>'<button class="pick'+(ms.indexOf(m)>=0?' on':'')+'" data-p="'+esc(m)+'">'+esc(m)+'</button>').join('')+'</div>':'')+
      '</div>'+
    '<div class="grp"><div class="gt">视觉模型</div>'+
      '<div class="gh">提示词优化 + 看图自动分类</div>'+
      '<div class="hint">固定用服务器的轻量模型 <b>'+esc(aiSys.visionModel||'未配置')+'</b>。'+
      '它只负责读图和写提示词，不跟着上面的生图接口走——那边不一定有视觉模型，也不该消耗你的生图额度。</div></div>'+
    '<div class="row2"><button class="btn" id="c-test">测试连接</button><button class="btn pri" id="c-save">保存</button></div>'+
    (aiState.cmsg?'<div class="stat '+aiState.cmsg.k+'">'+(aiState.cmsg.k==='busy'?'<span class="spin"></span>':'')+esc(aiState.cmsg.t)+'</div>':'');
}
const aiState={cmsg:null};
function cmsg(k,t){aiState.cmsg=t?{k,t}:null;aiRender();}
function readCfg(){
  const g=id=>{const el=document.getElementById(id);return el?el.value.trim():'';};
  const cur=aiCfg();
  return {baseUrl:g('c-b'),apiKey:g('c-k'),imageModels:g('c-i'),
          model:g('c-m')||cur.model||'',size:g('c-s')||cur.size||'1024x1024'};
}
function bindCfg(){
  const save=()=>localStorage.setItem(AIKEY,JSON.stringify(readCfg()));
  document.getElementById('c-save').onclick=()=>{save();cmsg('ok','已保存到本机');};
  ['c-m','c-s'].forEach(id=>{const el=document.getElementById(id);if(el)el.onchange=save;});
  document.getElementById('c-test').onclick=async()=>{
    save(); cmsg('busy','连接中…');
    try{const d=await aiPost('models',{});cmsg('ok','连接成功，接口提供 '+(d.models||[]).length+' 个模型');}
    catch(e){cmsg('err','连接失败：'+(e.message||e));}
  };
  document.getElementById('c-pull').onclick=async()=>{
    save(); cmsg('busy','拉取中…');
    try{
      const d=await aiPost('models',{});
      const all=d.models||[];
      const imgs=all.filter(m=>/image|dall|flux|sd|midjourney|seedream|qwen-image|imagen|kolors/i.test(m));
      aiPicks=imgs.length?imgs:all;
      cmsg('ok',imgs.length?'点下面的模型名即可加入/移出（不会覆盖你已填的）'
                           :'没识别出生图模型，列出全部 '+all.length+' 个自己挑');
    }catch(e){aiPicks=[];cmsg('err','拉取失败：'+(e.message||e));}
  };
  aiBody.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{
    const m=b.dataset.p, box=document.getElementById('c-i');
    const l=aiSplit(box.value); const i=l.indexOf(m);
    if(i>=0)l.splice(i,1); else l.push(m);
    box.value=l.join(', '); save(); aiRender();
  });
}
